<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Расписание{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/schedule.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/teachers-panel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/subjects.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/drag-drop.css') }}">
</head>
<body>
    <!-- шапка сайта -->
    <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Открыть меню">
            <img src="static\icons\Menu.svg" alt="">
        </button>
        <h1 class="topbar-title">{% block page_title %}{{ self.title() }}{% endblock %}</h1>
        <div class="topbar-actions">
            {% block header_actions %}{% endblock %}
        </div>
    </header>

    <!-- затемнение под меню -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- меню -->
    <nav class="sidebar" id="sidebar">
        <ul class="nav-links">
            <li><a href="{{ url_for('schedule_page') }}" class="{% if active_page == 'schedule' %}active{% endif %}">Расписание занятий</a></li>
            <li><a href="{{ url_for('groups_page') }}" class="{% if active_page == 'groups' %}active{% endif %}">Группы</a></li>
            <li><a href="{{ url_for('teachers_page') }}" class="{% if active_page == 'teachers' %}active{% endif %}">Преподаватели</a></li>
            <li><a href="{{ url_for('subjects_page') }}" class="{% if active_page == 'subjects' %}active{% endif %}">Дисциплины</a></li>
        </ul>
    </nav>
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
