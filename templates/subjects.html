{% extends "base.html" %}

{% block title %}Дисциплины{% endblock %}

{% block content %}
<div class="container">    
    <!-- форма добавления/редактирования -->
    <div class="form-section">
        <h2 id="formTitle">Добавить дисциплину</h2>
        <form id="subjectForm">
            <input type="hidden" id="subjectId">
            <div class="form-group">
                <label>Название:</label>
                <input type="text" id="subjectName" required placeholder="Информатика">
            </div>
            <div class="form-group">
                <label>Сокращённое название:</label>
                <input type="text" id="subjectShortName" required placeholder="ИНФ" maxlength="10">
            </div>
            <div class="form-group">
                <label>Цвет дисциплины:</label>
                <input type="color" id="subjectColor" value="#3498db" class="color-picker-large">
            </div>
            <div class="form-group">
                <label>Преподаватели:</label>
                <div id="teachersList" class="checkbox-list"></div>
            </div>
            <button type="submit" class="btn">Сохранить</button>
            <button type="button" id="cancelBtn" class="btn btn-secondary">Отмена</button>
        </form>
    </div>
    
    <!-- список дисциплин -->
    <div class="list-section">
        <h2>Список дисциплин</h2>
        <div id="subjectsList" class="cards-container"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/subjects/subjects-data.js') }}"></script>
<script src="{{ url_for('static', filename='js/subjects/subjects-renderer.js') }}"></script>
<script src="{{ url_for('static', filename='js/subjects/subjects-form.js') }}"></script>
<script src="{{ url_for('static', filename='js/subjects/subjects.js') }}"></script>
{% endblock %}
