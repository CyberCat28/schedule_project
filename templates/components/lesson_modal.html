<!-- модальное окно добавления/редактирования занятия -->
<div class="modal" id="lessonModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Добавить занятие</h2>
            <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <form id="lessonForm">
            <input type="hidden" id="lessonId">
            
            <div class="form-group">
                <label>Группа:</label>
                <select id="lessonGroup" required>
                    <option value="">Выберите группу</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>День недели:</label>
                <select id="lessonDay" required>
                    <option value="">Выберите день</option>
                    <option value="0">Понедельник</option>
                    <option value="1">Вторник</option>
                    <option value="2">Среда</option>
                    <option value="3">Четверг</option>
                    <option value="4">Пятница</option>
                    <option value="5">Суббота</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Преподаватель:</label>
                <select id="lessonTeacher" required>
                    <option value="">Выберите преподавателя</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Дисциплина:</label>
                <select id="lessonSubject" required>
                    <option value="">Сначала выберите преподавателя</option>
                </select>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>1-я неделя (пара):</label>
                    <select id="lessonWeek1">
                        <option value="0">—</option>
                        <option value="1">1 пара</option>
                        <option value="2">2 пара</option>
                        <option value="3">3 пара</option>
                        <option value="4">4 пара</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>2-я неделя (пара):</label>
                    <select id="lessonWeek2">
                        <option value="0">—</option>
                        <option value="1">1 пара</option>
                        <option value="2">2 пара</option>
                        <option value="3">3 пара</option>
                        <option value="4">4 пара</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Кабинет:</label>
                <input type="text" id="lessonClassroom" placeholder="Например: 305">
            </div>
            
            <div class="form-group">
                <label>Тип занятия:</label>
                <select id="lessonType">
                    <option value="Лекция">Лекция</option>
                    <option value="Практика">Практика</option>
                    <option value="Лабораторная">Лабораторная</option>
                    <option value="Экзамен">Экзамен</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <button type="button" class="btn btn-secondary" id="cancelBtn">Отмена</button>
                <button type="button" class="btn btn-danger" id="deleteBtn" style="display: none;">Удалить</button>
            </div>
        </form>
    </div>
</div>
